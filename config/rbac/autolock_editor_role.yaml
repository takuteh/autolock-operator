# This rule is not used by the project autolock-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the autolock.takuteh.uk.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: autolock-operator
    app.kubernetes.io/managed-by: kustomize
  name: autolock-editor-role
rules:
- apiGroups:
  - autolock.takuteh.uk
  resources:
  - autolocks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autolock.takuteh.uk
  resources:
  - autolocks/status
  verbs:
  - get
