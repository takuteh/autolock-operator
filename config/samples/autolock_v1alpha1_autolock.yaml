apiVersion: autolock.takuteh.uk/v1alpha1
kind: Autolock
metadata:
  name: autolock-sample
  namespace: autolock
spec:
  main:
    replicas: 2
    image: nginx
    config:
      main:
        autolock: true
        timeout_seq: 300
        ignore_clsw: false
        rotate_direction: "left"
        authorize_internal_users: false
        authorize_external_users: true
      mqtt:
        broker_address: autolock-mqtt-broker
        mqtt_port: 1883

        publish:
          boot:
            message: start
            topic: /autolock/boot

        subscribe:
          change_config:
            topic: /autolock/change_conf
          close:
            message: "1"
            topic: /door/close
          open:
            message: "1"
            topic: /door/open
          relay_off:
            message: "1"
            topic: /door/relay_off
          relay_on:
            message: "1"
            topic: /door/relay_on

  webapp:
    image: nginx
    replicas: 3
    ingress:
      enabled: true
      className: traefik
      host: autolock.webapp
      path: /
      pathType: Prefix

  webhook:
    image: nginx
    replicas: 3
    ingress:
      enabled: true
      className: traefik
      host: autolock.webhook
      path: /
      pathType: Prefix

  mqtt:
    image: eclipse-mosquitto
    replicas: 3
      
  authdb:
    image: mariadb:latest
    secretName: autolock-auth-db-secret

